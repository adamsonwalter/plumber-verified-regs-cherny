# Netlify configuration for the Verified Plumbing & Roofing Regulations Register.
#
# Architecture: a static single page (public/) whose sole source of truth is a
# git-committed register.json, plus a scheduled Python function that re-verifies
# every source URL on the platform's own scheduler and proposes an updated
# register (committed back if a publish token is configured).

[build]
  # The published site is the static public/ directory.
  publish = "public"

  # Redirect /admin to /admin/index.html (sign-in gated dashboard).
  # Other paths under /admin/ are served directly by the file system.
  # The root / serves the plumber/roofer-facing production app.
  # The scheduled re-verification function lives in functions/.
  functions = "functions"
  # Build CI check: the OFFLINE gate only — structure, domain allow-list and
  # self-consistency, no network. It fails the deploy on a malformed register.
  #
  # It is offline deliberately. The build command was previously --live, but
  # Netlify's build servers are consistently 403'd by Cloudflare on
  # bpc.vic.gov.au (different TLS/JA3 fingerprint than an ordinary client), so
  # the live gate cannot pass inside a Netlify build. See LESSONS-LEARNED.md §1.
  #
  # The live gate therefore runs locally before commit, and is *intended* to run
  # in the weekly scheduled agent below. Whether it passes from the functions
  # runtime is UNPROVEN — no scheduled run has ever completed. See
  # docs/AI-CODER-ANSWERS.md.
  command = "python3 scripts/verify_register.py --offline"

[build.environment]
  # Pin the Python runtime the scheduled function runs on.
  PYTHON_VERSION = "3.12"

# ----------------------------------------------------------------------------
# Scheduled re-verification agent (capability b).
# This is the platform's OWN scheduler — NOT an in-process setInterval timer.
# Runs weekly, Monday 07:00 UTC. The handler in
# functions/verify_register_scheduled.py is idempotent and keyed on the
# Netlify-provided invocation id; it never trusts a request body.
#
# IMPORTANT: scheduled functions only fire automatically for PUBLISHED deploys.
#
# KNOWN BROKEN AS CONFIGURED. A 30 s limit applies to *synchronous* scheduled
# functions, and this file is not named -background.py, so it deploys as
# synchronous. A full live verification of the 60 sources was measured at
# 56.7 s on a fast local connection with no Cloudflare challenges — nearly 2x
# the ceiling. It cannot finish. Rename to
# verify_register_scheduled-background.py (identical handler signature, 15 min
# ceiling).
#
# Two further blockers, both confirmed: this config has no `included_files`, so
# scripts/ is likely absent from the function bundle and the import of
# verify_register/fsutil fails; and the publisher commits root register.json
# while the site serves public/register.json with no copy step, so even a
# successful run would never reach a user. See docs/AI-CODER-ANSWERS.md §B.
# ----------------------------------------------------------------------------
[functions."verify_register_scheduled"]
  schedule = "0 7 * * 1"

# Sensible security/ caching headers for the static assets.
[[headers]]
  for = "/register.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    # register.json changes only when the agent commits an update; let the CDN
    # cache briefly but always revalidate so a fresh deploy is picked up.
    Cache-Control = "public, max-age=60, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

# The /*.html pattern does not match the bare "/" path, so the root document —
# the one almost every visitor actually loads — was served without these two
# headers while /index.html had them. Verified against production.
[[headers]]
  for = "/"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

# The Home Screen install path depends on this being served as a manifest, not
# as a download; iOS silently ignores a mistyped one.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
